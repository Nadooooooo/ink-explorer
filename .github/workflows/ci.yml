name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        id: node
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev --no-audit
      - run: npm exec -- playwright-core install --with-deps chromium
      - run: npm run check
      - run: npm run build
      - run: npm run test:data
      - run: node --experimental-strip-types --test scripts/activity-data-test.mjs
      - run: npm run test:node-readiness
      - run: npm run test:upstream-cache
      - run: npm run test:explorer-services
      - run: npm run test:public-proxy
      - run: npm run test:seo
      - run: npm run test:wallet-discovery
      - name: Test server security boundary
        run: |
          HOST=127.0.0.1 node server/server.mjs &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..20}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:4188/api/health >/dev/null; then
              ready=true
              break
            fi
            kill -0 "$server_pid" 2>/dev/null || break
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "The local explorer did not become ready."
            exit 1
          fi
          npm run test:security

      - name: Audit dependencies
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: npm audit --package-lock-only --include=dev --audit-level=high
      - name: Check upstream matcher advisories
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: npm run test:matcher-audit
