<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Ink Explorer share card</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        background:
          radial-gradient(ellipse at 86% 32%, #c2a9fa 0, transparent 44%),
          radial-gradient(ellipse at 92% 110%, #ba9df5 0, transparent 46%),
          #f7f4fd;
      }
      .wordmark { position: absolute; width: 614px; height: auto; left: 77px; top: 216px; }
      .sculpture { position: absolute; width: 616px; height: 616px; right: -42px; top: 7px; transform: rotate(-10deg); }
    </style>
  </head>
  <body>
    <img class="sculpture" src="block-lens-soft.webp" width="1254" height="1254" alt="">
    <img class="wordmark" src="../../public/brand/block-lens/wordmark.svg" width="560" height="180" alt="Ink Explorer">
  </body>
</html>
